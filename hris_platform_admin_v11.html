<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HRIS Platform Admin v11</title>
<style>
:root{--bg:#f6f8fb;--surface:#fff;--text:#172033;--muted:#687386;--border:#e4e8ef;--primary:#315efb;--primary2:#eef2ff;--success:#169c62;--warning:#c98a14;--sidebar:#101828}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:13px}.app{display:flex;min-height:100vh}.sidebar{width:235px;background:var(--sidebar);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0}.brand{font-weight:900;font-size:15px;padding:0 10px 16px}.workspace{margin:0 7px 12px;padding:9px 10px;border:1px solid #273248;background:#172033;border-radius:9px}.workspace small{display:block;color:#718096;font-size:7px;text-transform:uppercase;letter-spacing:.09em}.workspace strong{display:block;font-size:10px;margin-top:3px}.nav{padding:8px 10px;border-radius:8px;margin:3px 0;color:#aeb7c8;cursor:pointer;display:flex;gap:9px;align-items:center;font-size:10px}.nav.active,.nav:hover{background:#1d2a40;color:#fff}.ico{width:16px;text-align:center}.section{font-size:7px;color:#667085;text-transform:uppercase;letter-spacing:.1em;padding:14px 10px 5px}.main{margin-left:235px;width:calc(100% - 235px)}.topbar{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:3}.crumb{font-size:10px;color:var(--muted)}.topRight{display:flex;align-items:center;gap:8px}.iconBtn{border:1px solid var(--border);background:#fff;height:34px;width:34px;border-radius:8px}.roleSwitcher{height:35px;border:1px solid var(--border);background:#fff;border-radius:8px;padding:3px 8px 3px 10px;display:flex;align-items:center;gap:7px}.roleLabel{font-size:7px;letter-spacing:.09em;font-weight:800;color:#9aa2b1}.roleSelect{border:0;outline:0;background:#fff;color:var(--text);font-size:10px;font-weight:800;min-width:175px;cursor:pointer}.profile{padding:10px 20px;display:flex;gap:9px;align-items:center}.profile .avatar{width:29px;height:29px;border-radius:50%;background:#315efb;color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800}.profile strong{display:block;font-size:9px}.profile span{display:block;color:var(--muted);font-size:8px;margin-top:2px}.content{padding:22px 22px 34px}.paHero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.paEyebrow{font-size:9px;letter-spacing:.1em;font-weight:800;color:var(--primary);text-transform:uppercase}.paHero h1{margin:4px 0 5px;font-size:23px;letter-spacing:-.03em}.paHero p{margin:0;color:var(--muted);font-size:11px;line-height:1.55}.paContext{background:#fff;border:1px solid var(--border);border-radius:11px;padding:11px 13px;min-width:235px}.paContext small{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em}.paContext strong{display:block;font-size:11px;margin-top:4px}.paContext span{display:block;color:var(--muted);font-size:8px;margin-top:3px}.paNotice{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border:1px solid #dbe4ff;background:#f7f9ff;border-radius:10px;margin-bottom:16px}.mmInfoIcon{width:30px;height:30px;border-radius:8px;background:var(--primary2);display:grid;place-items:center;color:var(--primary);font-weight:800;flex:none}.paNotice b{font-size:9px}.paNotice span{display:block;color:var(--muted);font-size:8px;margin-top:3px;line-height:1.45}.paStats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.paStat{padding:15px;background:#fff;border:1px solid var(--border);border-radius:12px}.paStat small{display:block;color:var(--muted);font-size:9px}.paStat b{display:block;font-size:22px;margin-top:8px}.paStat span{font-size:8px;color:var(--success)}.paGrid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:16px}.paCard{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}.paCardHead{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.paCardHead h3{margin:0;font-size:11px}.paCardHead span{font-size:8px;color:var(--muted)}.paBody{padding:15px}.paRows{display:grid;gap:7px}.paRow{display:flex;align-items:center;justify-content:space-between;padding:10px 11px;border:1px solid var(--border);border-radius:9px}.paRowMain{display:flex;align-items:center;gap:9px}.paIcon{width:31px;height:31px;border-radius:8px;background:var(--primary2);display:grid;place-items:center;color:var(--primary);font-weight:800}.paRow b{font-size:9px}.paRow small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.paValue{text-align:right}.paValue b{font-size:11px}.paTable{width:100%;border-collapse:collapse}.paTable th{font-size:8px;padding:10px 12px;text-align:left;color:var(--muted);border-bottom:1px solid var(--border)}.paTable td{font-size:9px;padding:10px 12px;border-bottom:1px solid #edf0f4}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px}.btn,.mmAction{border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 11px;font-size:9px;cursor:pointer}.btn{background:var(--primary);border-color:var(--primary);color:#fff}.btn.secondary{background:#fff;color:var(--text)}.card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}.tableCard{overflow:auto}.notice{padding:12px 13px;background:#f7f9ff;border:1px solid #dbe4ff;border-radius:9px;font-size:9px;line-height:1.5}.notice strong{font-size:10px}.paPermission{padding:13px 15px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;margin-top:12px}.paPermission strong{font-size:9px}.paPermission p{margin:4px 0 0;color:var(--muted);font-size:8px;line-height:1.5}.badge{display:inline-block;padding:3px 7px;border-radius:999px;font-size:7px;font-weight:800}.badge.green{background:#eaf8f1;color:#16885a}.badge.yellow{background:#fff5dd;color:#a8730a}.badge.blue{background:#eef2ff;color:#315efb}.badge.gray{background:#eef0f3;color:#687386}.risk{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf0f4;font-size:9px}.risk:last-child{border-bottom:0}.toggle{width:33px;height:18px;border-radius:10px;background:#cbd2dc;position:relative;cursor:pointer}.toggle:after{content:'';position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:.15s}.toggle.on{background:#315efb}.toggle.on:after{left:17px}@media(max-width:1000px){.paStats{grid-template-columns:repeat(2,1fr)}.paGrid{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{width:72px}.sidebar .section,.sidebar .nav span:not(.ico),.workspace,.brand{display:none}.main{margin-left:72px;width:calc(100% - 72px)}.paHero{flex-direction:column}.roleSelect{min-width:145px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="brand">HRIS Platform</div><div class="workspace"><small>Workspace</small><strong>Platform Global</strong></div></aside>
<main class="main">
<header class="topbar"><div class="crumb" id="crumb">Platform Admin</div><div class="topRight"><button class="iconBtn">🔔</button><div class="roleSwitcher"><span class="roleLabel">ACCESS</span><select id="platformRoleSwitcher" class="roleSelect" onchange="switchPlatformRole(this.value)"><option value="super">Super Admin</option><option value="crm">Platform Admin — CRM</option><option value="finance">Platform Admin — Finance</option></select></div></div></header>
<div class="profile"><div class="avatar" id="avatar">SA</div><div><strong id="profileName">Super Administrator</strong><span id="profileScope">Global Access</span></div></div>
<section class="content" id="content"></section>
</main></div>
<script>
let platformRole='super', current='pa_dashboard';
const platformNav={crm:[{section:'Workspace'},{id:'pa_dashboard',label:'CRM Dashboard',ico:'▦'},{section:'CRM'},{id:'pa_customers',label:'Customers',ico:'♙'},{id:'pa_leads',label:'Leads',ico:'◎'},{id:'pa_pipeline',label:'Pipeline',ico:'◈'},{id:'pa_activities',label:'Activities',ico:'◷'},{id:'pa_followup',label:'Follow Up',ico:'↗'},{section:'Platform'},{id:'pa_corporates',label:'Corporate Accounts',ico:'▣'},{id:'pa_notifications',label:'Notification Center',ico:'♢'}],finance:[{section:'Workspace'},{id:'pa_dashboard',label:'Finance Dashboard',ico:'▦'},{section:'Finance'},{id:'pa_subscriptions',label:'Subscriptions',ico:'◫'},{id:'pa_payments',label:'Payment Verification',ico:'✓'},{id:'pa_history',label:'Payment History',ico:'◷'},{id:'pa_monitoring',label:'Service Monitoring',ico:'◉'},{id:'pa_renewal',label:'Renewal',ico:'↻'},{section:'Platform'},{id:'pa_corporates',label:'Corporate Accounts',ico:'▣'},{id:'pa_notifications',label:'Notification Center',ico:'♢'}]};
function badge(t,c){return `<span class="badge ${c||'gray'}">${t}</span>`}
function setCrumb(t){document.getElementById('crumb').textContent=t}
function updateProfile(initials,name,scope){document.getElementById('avatar').textContent=initials;document.getElementById('profileName').textContent=name;document.getElementById('profileScope').textContent=scope}
function switchPlatformRole(role){platformRole=role;if(role==='super'){document.querySelector('.workspace strong').textContent='Platform Global';updateProfile('SA','Super Administrator','Global Access');platformDashboard('super');renderSuperNav();return}const crm=role==='crm';document.querySelector('.workspace strong').textContent=crm?'CRM Operations':'Finance Operations';updateProfile(crm?'CR':'FI',crm?'Platform Admin — CRM':'Platform Admin — Finance',crm?'CRM Access':'Finance Access');renderPlatformNav();platformDashboard()}
function renderSuperNav(){document.getElementById('sidebar').innerHTML='<div class="brand">HRIS Platform</div><div class="workspace"><small>Workspace</small><strong>Platform Global</strong></div><div class="section">Overview</div><div class="nav active"><span class="ico">▦</span><span>Dashboard</span></div><div class="nav"><span class="ico">◈</span><span>Analytics</span></div><div class="section">Platform</div><div class="nav"><span class="ico">▣</span><span>Corporate Management</span></div><div class="nav"><span class="ico">♙</span><span>User Management</span></div><div class="nav"><span class="ico">⚿</span><span>Role & Permission</span></div><div class="nav"><span class="ico">▤</span><span>Module Management</span></div><div class="section">System</div><div class="nav"><span class="ico">◷</span><span>Audit Log</span></div><div class="nav"><span class="ico">◉</span><span>Security</span></div>'}
function renderPlatformNav(){const list=platformNav[platformRole]||[];let h='<div class="brand">HRIS Platform</div><div class="workspace"><small>Workspace</small><strong>'+ (platformRole==='crm'?'CRM Operations':'Finance Operations')+'</strong></div><div class="paNavContext"></div>';list.forEach(n=>{if(n.section){h+=`<div class="section">${n.section}</div>`}else{h+=`<div class="nav ${current===n.id?'active':''}" onclick="platformNavigate('${n.id}')"><span class="ico">${n.ico}</span><span>${n.label}</span></div>`}});document.getElementById('sidebar').innerHTML=h}
function platformNavigate(id){current=id;renderPlatformNav();if(platformRole==='crm')crmPage(id);else financePage(id)}
function platformDashboard(mode){if(mode==='super'){setCrumb('Dashboard');document.getElementById('content').innerHTML='<div class="paHero"><div><div class="paEyebrow">SUPER ADMIN</div><h1>Platform Overview</h1><p>Global administration and governance workspace.</p></div></div><div class="paNotice"><div class="mmInfoIcon">✓</div><div><b>Super Admin mode active</b><span>Gunakan dropdown ACCESS di kanan atas untuk berpindah ke Platform Admin CRM atau Finance.</span></div></div>';return}const crm=platformRole==='crm';const s=crm?[['Active Corporates','24','+3 this month'],['Customers','2,846','+8.4% vs last month'],['Open Leads','486','+12.1% this month'],['Pipeline Value','Rp 8.42B','+6.8% this month']]:[['Active Subscriptions','24','+3 this month'],['Pending Verification','17','Needs review'],['MRR','Rp 186.4M','+7.2% vs last month'],['Renewal Due','8','Next 30 days']];const left=crm?[['New Leads','186'],['Qualified','124'],['Proposal','96'],['Negotiation','80']]:[['Verified Payments','Rp 142.8M'],['Pending Payments','Rp 18.6M'],['Overdue','Rp 7.4M'],['Refund / Adjustment','Rp 1.2M']];const side=crm?[['Follow Up Due','47'],['Overdue Activities','13'],['Corporate Onboarding','6'],['Unassigned Leads','18']]:[['Pending Verification','17'],['Overdue Accounts','9'],['Renewal Due','8'],['Service At Risk','3']];setCrumb(crm?'CRM Dashboard':'Finance Dashboard');document.getElementById('content').innerHTML=`<div class="paHero"><div><div class="paEyebrow">PLATFORM ADMIN · ${crm?'CRM':'FINANCE'}</div><h1>${crm?'CRM Operations':'Finance Operations'}</h1><p>${crm?'Kelola customer lifecycle, pipeline, follow up, dan aktivitas seluruh corporate dari sisi platform.':'Monitor subscription, payment verification, revenue, service status, dan renewal seluruh corporate.'}</p></div><div class="paContext"><small>Access Context</small><strong>Platform Admin — ${crm?'CRM':'Finance'}</strong><span>Internal platform operator · restricted scope</span></div></div><div class="paNotice"><div class="mmInfoIcon">✓</div><div><b>Platform-level access</b><span>Cross-corporate access hanya untuk domain <strong>${crm?'CRM':'Finance'}</strong>. Konfigurasi Role & Permission, Security, System Settings, dan Module Management tidak tersedia.</span></div></div><div class="paStats">${s.map(x=>`<div class="paStat"><small>${x[0]}</small><b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div><div class="paGrid"><div class="paCard"><div class="paCardHead"><h3>${crm?'Pipeline Overview':'Payment & Revenue Overview'}</h3><span>Platform aggregate</span></div><div class="paBody"><div class="paRows">${left.map(x=>`<div class="paRow"><div class="paRowMain"><div class="paIcon">◈</div><div><b>${x[0]}</b><small>Current period</small></div></div><div class="paValue"><b>${x[1]}</b></div></div>`).join('')}</div></div></div><div class="paCard"><div class="paCardHead"><h3>${crm?'CRM Operations':'Finance Operations'}</h3><span>Action queue</span></div><div class="paBody"><div class="paRows">${side.map(x=>`<div class="paRow"><div><b>${x[0]}</b><small>Needs attention</small></div><div class="paValue"><b>${x[1]}</b></div></div>`).join('')}</div></div></div></div><div class="paCard"><div class="paCardHead"><h3>Recent Activity</h3><span>Latest events</span></div><div class="paBody"><div class="risk"><span><b>${crm?'PT Arunika Teknologi — lead updated':'PT Maju Digital — payment verified'}</b><small>12 minutes ago</small></span>${badge('Success','green')}</div><div class="risk"><span><b>${crm?'PT Cakra Nusantara — follow up assigned':'PT Tamanesia Raya Abadi — invoice generated'}</b><small>34 minutes ago</small></span>${badge('Completed','green')}</div></div></div>`}
function crmPage(id){const map={pa_customers:['Customers','Database customer lintas corporate.'],pa_leads:['Leads','Lead intake, assignment, qualification, source attribution, dan follow up.'],pa_pipeline:['Pipeline','Monitor opportunity stage dan pipeline value per corporate.'],pa_activities:['Activities','Aktivitas sales, call, meeting, task, dan follow-up.'],pa_followup:['Follow Up','Queue follow-up berdasarkan due date, owner, priority, dan status.'],pa_corporates:['Corporate Accounts','Daftar corporate customer dan status layanan CRM.'],pa_notifications:['Notification Center','Notifikasi operasional CRM.']};listPage(map[id]||map.pa_customers, ['PT Tamanesia Raya Abadi','PT Arunika Teknologi','PT Maju Digital','PT Cakra Nusantara'], ['Active','Active','Trial','Active'])}
function financePage(id){const map={pa_subscriptions:['Subscriptions','Subscription plan, billing cycle, status, dan entitlement corporate.'],pa_payments:['Payment Verification','Verifikasi pembayaran masuk dan cocokkan dengan invoice/subscription.'],pa_history:['Payment History','Riwayat pembayaran, settlement, adjustment, dan refund.'],pa_monitoring:['Service Monitoring','Monitor active, overdue, suspended, dan account health.'],pa_renewal:['Renewal','Queue renewal corporate, due date, reminder, dan status perpanjangan.'],pa_corporates:['Corporate Accounts','Daftar corporate customer, plan, billing status, dan account health.'],pa_notifications:['Notification Center','Notifikasi payment, renewal, overdue, dan service events.']};listPage(map[id]||map.pa_subscriptions, ['PT Tamanesia Raya Abadi','PT Arunika Teknologi','PT Maju Digital','PT Cakra Nusantara'], ['Active','Active','Trial','Active'])}
function listPage(meta,names,statuses){setCrumb(meta[0]);const finance=platformRole==='finance';document.getElementById('content').innerHTML=`<div class="paHero"><div><div class="paEyebrow">PLATFORM ADMIN · ${finance?'FINANCE':'CRM'}</div><h1>${meta[0]}</h1><p>${meta[1]}</p></div><div class="paContext"><small>Access Context</small><strong>${finance?'Finance Operations':'CRM Operations'}</strong><span>Cross-corporate · domain restricted</span></div></div><div class="toolbar"><input class="search" placeholder="Search..." oninput="filterRows(this)"><button class="btn secondary">Export</button><button class="btn">${finance?'Finance Action':'CRM Action'}</button></div><div class="card tableCard"><table class="paTable"><thead><tr><th>Corporate / Reference</th><th>Domain</th><th>Status</th><th>Action</th></tr></thead><tbody>${names.map((n,i)=>`<tr><td><b>${n}</b></td><td>${finance?'Finance':'CRM'}</td><td>${badge(statuses[i],statuses[i]==='Trial'?'yellow':'green')}</td><td><button class="mmAction" onclick="alert('${n} · ${meta[0]}')">View</button></td></tr>`).join('')}</tbody></table></div><div class="paPermission"><strong>Role Boundary</strong><p>Platform Admin ${finance?'Finance':'CRM'} dapat mengelola operasional domainnya, tetapi tidak dapat mengubah Role & Permission global, Security Policy, System Settings, atau Module Management.</p></div>`}
function filterRows(input){const q=input.value.toLowerCase();document.querySelectorAll('.paTable tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
renderSuperNav();platformDashboard('super');
</script>
</body>
</html>
